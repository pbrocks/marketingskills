site_name: Marketing Skills - Documentation
hooks:
  - hooks.py

theme:
  name: readthedocs
  highlightjs: true

markdown_extensions:
  - admonition
  - tables
  - fenced_code

# Skill/tool source files (CLI .js, JSON/CSV data, HTML samples) are copied as-is
# alongside their markdown, so in-page links from the docs to that source resolve
# on the built site.

# 'Skills' and 'Tools' sections are appended automatically by hooks.py (on_config)
# from the docs/skills and docs/tools symlinks — no need to list ~300 pages here.
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Versioning: versioning.md
